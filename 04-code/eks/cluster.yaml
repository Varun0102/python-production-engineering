# eksctl config for the Complaint Triage lab.
# Replace the two subnet IDs with your own (Part 01 output, or VPC console).
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: triage-cluster
  region: ap-south-1

vpc:
  subnets:
    public:
      ap-south-1a: { id: subnet-REPLACE-WITH-TRIAGE-PUBLIC-A }
      ap-south-1b: { id: subnet-REPLACE-WITH-TRIAGE-PUBLIC-B }

managedNodeGroups:
  - name: triage-nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 20
